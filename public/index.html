<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="これからの配信予定を日本時間で確認できるスケジュールページです。">
    <title>いたシャキ！配信スケジュール</title>
    <link rel="icon" href="favicon.png?v=2" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="favicon.png?v=2" sizes="512x512">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="site-shell">
      <header class="hero">
        <p class="eyebrow">STREAM SCHEDULE</p>
        <h1>いたシャキ！配信スケジュール</h1>
        <aside class="notices" aria-labelledby="notices-title" aria-live="polite">
          <p id="notices-title" class="notices-title">お知らせ</p>
          <ul class="notices-list">
            <li>初見依頼は配信内容にかかわらず、できるかぎり対応しますので、遠慮なくおっしゃってください</li>
            <li>本配信の最初はルレ消化を行います（アラルレ他）</li>
          </ul>
        </aside>
      </header>

      <section class="schedule-section" aria-label="配信予定一覧">
        <div class="section-heading">
          <nav class="filters" aria-label="表示する期間">
            <button class="filter-button" type="button" data-filter="today" aria-pressed="false">今日</button>
            <button class="filter-button" type="button" data-filter="week" aria-pressed="false">今週</button>
            <button class="filter-button is-active" type="button" data-filter="next7" aria-pressed="true">７日間後まで</button>
            <button class="filter-button" type="button" data-filter="all" aria-pressed="false">今後すべて</button>
          </nav>
        </div>

        <p id="schedule-message" class="schedule-message" role="status" aria-live="polite">予定を読み込んでいます。</p>
        <div id="schedule-list" class="schedule-grid" aria-live="polite" aria-busy="true"></div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
